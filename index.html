<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Carrinho</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background: #F0F2F5; margin: 0;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .tabular { font-variant-numeric: tabular-nums; }

    @keyframes totalPop {
      0%,100% { transform: scale(1); color: #0F1923; }
      40%      { transform: scale(1.1); color: #22C55E; }
    }
    .total-pop { animation: totalPop 0.38s ease; }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .slide-up { animation: slideUp 0.25s ease-out; }

    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    .fade-in { animation: fadeIn 0.2s ease; }

    /* html5-qrcode overrides */
    #qr-reader video { border-radius: 14px; width: 100% !important; }
    #qr-reader img   { border-radius: 14px; }
    #qr-reader { width: 100%; }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ============================================================
       FIREBASE CONFIG — substitua pelos seus dados do projeto
       ============================================================ -->
  <script>
    const firebaseConfig = {
      apiKey:            "AIzaSyDFyorDB3H0hza1eFOc5VGzNi82uJq_SRI",
      authDomain:        "supermercado-d5b29.firebaseapp.com",
      projectId:         "supermercado-d5b29",
      storageBucket:     "supermercado-d5b29.firebasestorage.app",
      messagingSenderId: "1072113403376",
      appId:             "1:1072113403376:web:0434c01234937fc35a4935"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ============================================================
       UTILITÁRIOS
       ============================================================ */
    const fmt = v =>
      new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

    const fmtDate = ts => {
      if (!ts) return '';
      const d = ts?.toDate?.() ?? (ts instanceof Date ? ts : new Date());
      return new Intl.DateTimeFormat('pt-BR', {
        day: '2-digit', month: '2-digit', year: '2-digit',
        hour: '2-digit', minute: '2-digit'
      }).format(d);
    };

    const uid4 = () => Math.random().toString(36).substr(2, 9);
    const parseNum = s => parseFloat(String(s).replace(',', '.')) || 0;

    /* ============================================================
       FIREBASE — helpers
       ============================================================ */
    const cartsRef    = uid => db.collection(`users/${uid}/carts`);
    const productsRef = uid => db.collection(`users/${uid}/products`);

    const getActiveCart = async uid => {
      const snap = await cartsRef(uid).get();
      return snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .find(c => c.status === 'active') || null;
    };

    const createCart = async (uid, store) => {
      const ref  = cartsRef(uid).doc();
      const data = {
        status: 'active', store: store || 'BH Supermercados',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        items: [], total: 0
      };
      await ref.set(data);
      return { id: ref.id, ...data, createdAt: new Date() };
    };

    const saveCart = async (uid, cartId, items) => {
      const total = items.reduce((s, i) => s + i.subtotal, 0);
      await cartsRef(uid).doc(cartId).update({ items, total });
      return total;
    };

    const finalizeCart = async (uid, cartId, items, store) => {
      const total = items.reduce((s, i) => s + i.subtotal, 0);
      await cartsRef(uid).doc(cartId).update({
        status: 'completed', store,
        completedAt: firebase.firestore.FieldValue.serverTimestamp(),
        items, total
      });
    };

    const deleteCart = async (uid, cartId) =>
      cartsRef(uid).doc(cartId).delete();

    const getHistory = async uid => {
      const snap = await cartsRef(uid).get();
      return snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(c => c.status === 'completed')
        .sort((a, b) => {
          const da = a.completedAt?.toDate?.() || new Date(0);
          const db_ = b.completedAt?.toDate?.() || new Date(0);
          return db_ - da;
        })
        .slice(0, 40);
    };

    const getCachedProduct = async (uid, ean) => {
      try {
        const doc = await productsRef(uid).doc(ean).get();
        return doc.exists ? doc.data() : null;
      } catch { return null; }
    };

    const cacheProduct = async (uid, ean, name, price) => {
      if (!ean) return;
      const data = { name, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      if (price != null) data.lastPrice = price;
      await productsRef(uid).doc(ean).set(data, { merge: true });
    };

    /* ============================================================
       OPEN FOOD FACTS — busca nome pelo EAN
       ============================================================ */
    const lookupEAN = async ean => {
      try {
        const res  = await fetch(`https://world.openfoodfacts.org/api/v0/product/${ean}.json`);
        const data = await res.json();
        if (data.status === 1 && data.product) {
          const p    = data.product;
          const name = p.product_name_pt || p.product_name || '';
          const brand = p.brands || '';
          if (name && brand) return `${name} (${brand})`;
          return name || brand || null;
        }
      } catch {}
      return null;
    };

    /* ============================================================
       ÍCONES
       ============================================================ */
    const Ico = ({ n, size = 20, cls = '' }) => {
      const base = {
        width: size, height: size,
        fill: 'none', stroke: 'currentColor',
        strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
        viewBox: '0 0 24 24',
        className: cls,
        style: { flexShrink: 0, display: 'inline-block' }
      };
      switch (n) {
        case 'cart':    return <svg {...base}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>;
        case 'scan':    return <svg {...base}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>;
        case 'plus':    return <svg {...base} strokeWidth={2.5}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        case 'trash':   return <svg {...base}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>;
        case 'check':   return <svg {...base} strokeWidth={2.5}><polyline points="20 6 9 17 4 12"/></svg>;
        case 'back':    return <svg {...base}><polyline points="15 18 9 12 15 6"/></svg>;
        case 'history': return <svg {...base}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        case 'edit':    return <svg {...base}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        case 'close':   return <svg {...base}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        case 'tag':     return <svg {...base}><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>;
        case 'barcode': return (
          <svg width={size} height={size} viewBox="0 0 100 56" fill="currentColor" className={cls} style={{ flexShrink: 0, display: 'inline-block' }}>
            <rect x="2"  y="0" width="5"  height="56"/>
            <rect x="11" y="0" width="3"  height="56"/>
            <rect x="17" y="0" width="7"  height="56"/>
            <rect x="27" y="0" width="3"  height="56"/>
            <rect x="33" y="0" width="5"  height="56"/>
            <rect x="41" y="0" width="3"  height="56"/>
            <rect x="47" y="0" width="7"  height="56"/>
            <rect x="57" y="0" width="3"  height="56"/>
            <rect x="63" y="0" width="5"  height="56"/>
            <rect x="71" y="0" width="3"  height="56"/>
            <rect x="77" y="0" width="5"  height="56"/>
            <rect x="85" y="0" width="3"  height="56"/>
            <rect x="91" y="0" width="7"  height="56"/>
          </svg>
        );
        default: return null;
      }
    };

    /* ============================================================
       SPINNER / LOADING
       ============================================================ */
    const Spinner = ({ size = 32, color = '#F59E0B' }) => (
      <div
        className="animate-spin"
        style={{ width: size, height: size, borderRadius: '50%',
                 border: `4px solid ${color}33`, borderTopColor: color }}
      />
    );

    const FullLoading = ({ text = 'Carregando...' }) => (
      <div className="fixed inset-0 bg-[#F0F2F5] flex flex-col items-center justify-center gap-3 z-50">
        <Spinner size={40} /><p className="text-gray-400 text-sm">{text}</p>
      </div>
    );

    /* ============================================================
       HEADER
       ============================================================ */
    const Header = ({ title, subtitle, onBack, right }) => (
      <div
        className="bg-[#0F1923] text-white px-4 sticky top-0 z-40 flex items-center justify-between"
        style={{ paddingTop: 'calc(env(safe-area-inset-top,0px) + 12px)', paddingBottom: 12 }}
      >
        <div className="flex items-center gap-3">
          {onBack
            ? <button onClick={onBack} className="p-1 -ml-1 rounded-full active:bg-white/10"><Ico n="back" size={24}/></button>
            : <Ico n="cart" size={22} cls="text-[#F59E0B]"/>
          }
          <div>
            <p className="font-semibold text-base leading-tight">{title}</p>
            {subtitle && <p className="text-white/40 text-xs">{subtitle}</p>}
          </div>
        </div>
        {right}
      </div>
    );

    /* ============================================================
       DIÁLOGO DE CONFIRMAÇÃO
       ============================================================ */
    const ConfirmDialog = ({ title, message, confirmLabel = 'Confirmar', confirmColor = '#EF4444', onConfirm, onCancel }) => (
      <div
        className="fixed inset-0 bg-black/60 z-[60] flex items-end justify-center fade-in"
        onClick={onCancel}
        style={{ paddingBottom: 'env(safe-area-inset-bottom,0px)' }}
      >
        <div className="bg-white w-full max-w-md rounded-t-3xl px-6 pt-6 pb-8 slide-up" onClick={e => e.stopPropagation()}>
          {title && <h3 className="font-bold text-[#0F1923] text-xl mb-2 text-center">{title}</h3>}
          <p className="text-gray-400 text-center mb-6 text-sm leading-relaxed">{message}</p>
          <div className="flex gap-3">
            <button onClick={onCancel} className="flex-1 py-3 rounded-2xl border border-gray-200 text-gray-500 font-medium text-sm active:bg-gray-50">
              Cancelar
            </button>
            <button onClick={onConfirm} className="flex-1 py-3 rounded-2xl text-white font-semibold text-sm active:opacity-80" style={{ background: confirmColor }}>
              {confirmLabel}
            </button>
          </div>
        </div>
      </div>
    );

    /* ============================================================
       TELA DO SCANNER
       ============================================================ */
    const ScannerView = ({ onScan, onCancel }) => {
      const [mode, setMode]             = useState('camera');
      const [manualCode, setManualCode] = useState('');
      const [cameraError, setCameraError] = useState('');
      const scannerRef = useRef(null);
      const scannedRef = useRef(false);

      useEffect(() => {
        if (mode !== 'camera') return;
        scannedRef.current = false;

        let scanner;
        try { scanner = new Html5Qrcode('qr-reader'); }
        catch(e) { setCameraError('Camera indisponivel. Use a entrada manual.'); setMode('manual'); return; }
        scannerRef.current = scanner;

        scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 280, height: 120 } },
          function(text) {
            if (scannedRef.current) return;
            scannedRef.current = true;
            scannerRef.current = null;
            scanner.stop()
              .catch(function() {})
              .finally(function() { onScan(text); });
          },
          function() {}
        ).catch(function() {
          setCameraError('Camera indisponivel. Use a entrada manual.');
          setMode('manual');
        });

        return function() {
          try { if (scannerRef.current) { scannerRef.current.stop().catch(function(){}); } }
          catch(e) {}
        };
      }, [mode]);

      return (
        <div className="fixed inset-0 bg-[#0F1923] z-50 flex flex-col"
             style={{ paddingTop: 'env(safe-area-inset-top,0px)' }}>
          {/* barra superior */}
          <div className="flex items-center justify-between px-4 py-3">
            <button onClick={onCancel} className="p-1 text-white/50 active:text-white"><Ico n="close" size={26}/></button>
            <span className="text-white font-semibold">Adicionar Item</span>
            <button
              onClick={() => { setCameraError(''); setMode(mode === 'camera' ? 'manual' : 'camera'); }}
              className="text-[#F59E0B] text-sm font-semibold px-2 py-1"
            >
              {mode === 'camera' ? 'Manual' : 'Câmera'}
            </button>
          </div>

          {mode === 'camera' ? (
            <div className="flex-1 flex flex-col items-center px-4 pt-2">
              <p className="text-white/40 text-sm mb-4">Aponte para o código de barras</p>
              <div id="qr-reader" className="w-full max-w-sm"/>
              {cameraError && <p className="text-red-400 text-sm mt-3 text-center">{cameraError}</p>}
            </div>
          ) : (
            <div className="flex-1 flex flex-col items-center justify-center px-6">
              <Ico n="barcode" size={56} cls="text-[#F59E0B] mb-5"/>
              <p className="text-white/50 text-sm text-center mb-5">Digite o código EAN do produto</p>
              <input
                type="number" inputMode="numeric"
                value={manualCode} onChange={e => setManualCode(e.target.value)}
                placeholder="7891234567890" autoFocus
                className="w-full bg-white/10 text-white placeholder-white/20 border border-white/20 rounded-2xl px-4 py-3 text-center text-lg tracking-widest tabular focus:outline-none focus:border-[#F59E0B] transition-colors"
              />
              <button
                onClick={() => manualCode.trim() && onScan(manualCode.trim())}
                disabled={!manualCode.trim()}
                className="mt-3 w-full py-3 rounded-2xl font-bold text-[#0F1923] disabled:opacity-30 active:scale-95 transition-transform"
                style={{ background: '#F59E0B' }}
              >
                Buscar Produto
              </button>
            </div>
          )}

          <div className="px-6" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom,0px) + 24px)' }}>
            <button
              onClick={() => onScan('')}
              className="w-full text-white/30 text-sm py-3 text-center active:text-white/60 transition-colors"
            >
              Adicionar produto sem código de barras
            </button>
          </div>
        </div>
      );
    };

    /* ============================================================
       FORMULÁRIO DE ITEM
       ============================================================ */
    const AddItemForm = ({ ean, productName, lastPrice, editId, prefillQty, prefillPrice, onAdd, onBack }) => {
      const [name,        setName]        = useState(productName || '');
      const [qty,         setQty]         = useState(prefillQty  != null ? String(prefillQty)  : '1');
      const [price,       setPrice]       = useState(
        prefillPrice != null ? String(prefillPrice).replace('.', ',')
          : lastPrice != null ? String(lastPrice).replace('.', ',') : ''
      );
      const [editingName, setEditingName] = useState(!productName);

      const qtyN     = parseNum(qty);
      const priceN   = parseNum(price);
      const subtotal = qtyN * priceN;
      const canAdd   = name.trim() && qtyN > 0 && priceN > 0;

      const adjQty = delta => {
        const next = Math.max(0.5, parseNum(qty) + delta);
        setQty(Number.isInteger(next) ? String(next) : next.toFixed(1));
      };

      return (
        <div className="fixed inset-0 bg-[#F0F2F5] z-50 flex flex-col"
             style={{ paddingTop: 'env(safe-area-inset-top,0px)' }}>
          <div className="bg-[#0F1923] text-white px-4 flex items-center gap-3"
               style={{ paddingTop: 12, paddingBottom: 12 }}>
            <button onClick={onBack} className="p-1 -ml-1 active:bg-white/10 rounded-full">
              <Ico n="back" size={24}/>
            </button>
            <span className="font-semibold text-base">{editId ? 'Editar Item' : 'Adicionar Item'}</span>
          </div>

          <div className="flex-1 overflow-y-auto px-4 py-4 space-y-3">

            {/* Produto */}
            <div className="bg-white rounded-2xl p-4 shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs text-gray-400 uppercase tracking-wider font-medium">Produto</span>
                {productName && (
                  <button onClick={() => setEditingName(!editingName)} className="text-xs text-blue-500 font-medium">
                    {editingName ? 'Cancelar' : 'Editar nome'}
                  </button>
                )}
              </div>
              {ean && <p className="text-xs text-gray-300 tabular mb-1.5">EAN {ean}</p>}
              {editingName ? (
                <input
                  type="text" value={name} onChange={e => setName(e.target.value)}
                  placeholder="Nome do produto" autoFocus
                  className="w-full border-b-2 border-[#F59E0B] py-1.5 text-gray-800 text-base focus:outline-none bg-transparent"
                />
              ) : (
                <p className="text-gray-800 font-medium leading-snug">{name}</p>
              )}
              {lastPrice != null && (
                <p className="text-xs text-emerald-500 mt-1.5 flex items-center gap-1">
                  <Ico n="tag" size={12}/> Última compra: {fmt(lastPrice)}
                </p>
              )}
            </div>

            {/* Quantidade */}
            <div className="bg-white rounded-2xl p-4 shadow-sm">
              <span className="text-xs text-gray-400 uppercase tracking-wider font-medium block mb-3">Quantidade</span>
              <div className="flex items-center gap-4">
                <button onClick={() => adjQty(-1)}
                  className="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center text-2xl text-gray-500 active:bg-gray-200 flex-shrink-0">−</button>
                <input
                  type="text" inputMode="decimal"
                  value={qty} onChange={e => setQty(e.target.value)}
                  className="flex-1 text-center text-3xl font-black text-[#0F1923] focus:outline-none border-b-2 border-gray-100 focus:border-[#F59E0B] pb-1 tabular transition-colors"
                />
                <button onClick={() => adjQty(1)}
                  className="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center text-2xl text-gray-500 active:bg-gray-200 flex-shrink-0">+</button>
              </div>
            </div>

            {/* Preço */}
            <div className="bg-white rounded-2xl p-4 shadow-sm">
              <span className="text-xs text-gray-400 uppercase tracking-wider font-medium block mb-3">Preço Unitário</span>
              <div className="flex items-baseline gap-2">
                <span className="text-gray-300 text-xl font-medium">R$</span>
                <input
                  type="text" inputMode="decimal"
                  value={price} onChange={e => setPrice(e.target.value)}
                  placeholder="0,00"
                  className="flex-1 text-3xl font-black text-[#0F1923] focus:outline-none border-b-2 border-gray-100 focus:border-[#F59E0B] pb-1 tabular transition-colors"
                />
              </div>
            </div>

            {/* Subtotal preview */}
            <div className={`rounded-2xl p-4 transition-all ${canAdd
                ? 'bg-[#F59E0B]/10 border border-[#F59E0B]/25'
                : 'bg-gray-50 border border-gray-100'}`}>
              <div className="flex justify-between items-center">
                <span className="text-gray-400 text-sm">
                  {qtyN > 0 && priceN > 0 ? `${qtyN} × ${fmt(priceN)}` : 'Subtotal'}
                </span>
                <span className={`text-2xl font-black tabular ${canAdd ? 'text-[#0F1923]' : 'text-gray-200'}`}>
                  {fmt(subtotal)}
                </span>
              </div>
            </div>
          </div>

          {/* Botão adicionar */}
          <div className="px-4 pt-3 pb-6 bg-white border-t border-gray-100"
               style={{ paddingBottom: 'calc(env(safe-area-inset-bottom,0px) + 16px)' }}>
            <button
              onClick={() => canAdd && onAdd({ ean: ean || null, name: name.trim(), qty: qtyN, unitPrice: priceN, subtotal })}
              disabled={!canAdd}
              className="w-full py-4 rounded-2xl font-bold text-white text-base disabled:opacity-25 active:scale-95 transition-all shadow-md"
              style={{ background: canAdd ? '#22C55E' : '#9CA3AF' }}
            >
              {editId ? 'Salvar alterações' : 'Adicionar ao Carrinho'}
            </button>
          </div>
        </div>
      );
    };

    /* ============================================================
       CARD DE ITEM
       ============================================================ */
    const ItemCard = ({ item, onDelete, onEdit }) => (
      <div className="bg-white rounded-2xl shadow-sm flex items-center gap-3 px-4 py-3.5 fade-in">
        <div className="flex-1 min-w-0">
          <p className="text-gray-800 font-medium text-sm leading-snug" style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
            {item.name}
          </p>
          <p className="text-gray-400 text-xs mt-0.5 tabular">
            {item.qty === 1 ? `${fmt(item.unitPrice)}/un` : `${item.qty} × ${fmt(item.unitPrice)}`}
          </p>
        </div>
        <div className="flex items-center gap-1 flex-shrink-0">
          <span className="font-black text-[#0F1923] tabular text-base mr-1">{fmt(item.subtotal)}</span>
          <button onClick={() => onEdit(item)}
            className="p-1.5 rounded-xl text-gray-300 active:bg-blue-50 active:text-blue-500 transition-colors">
            <Ico n="edit" size={16}/>
          </button>
          <button onClick={() => onDelete(item.id)}
            className="p-1.5 rounded-xl text-gray-300 active:bg-red-50 active:text-red-500 transition-colors">
            <Ico n="trash" size={16}/>
          </button>
        </div>
      </div>
    );

    /* ============================================================
       TELA INICIAL
       ============================================================ */
    const HomeScreen = ({ onStartCart, onHistory }) => {
      const [store, setStore] = useState('BH Supermercados');
      const stores = ['BH Supermercados', 'San Michel', 'Outro'];

      return (
        <div className="min-h-screen bg-[#F0F2F5] flex flex-col">
          <Header
            title="Carrinho"
            subtitle="Gestor de compras"
            right={
              <button onClick={onHistory} className="p-2 -mr-1 text-white/50 active:text-white">
                <Ico n="history" size={22}/>
              </button>
            }
          />
          <div className="flex-1 flex flex-col items-center justify-center px-6 pb-12 text-center">
            <div className="w-24 h-24 rounded-3xl bg-[#0F1923] flex items-center justify-center mb-7 shadow-xl">
              <Ico n="cart" size={44} cls="text-[#F59E0B]"/>
            </div>
            <h2 className="text-2xl font-black text-[#0F1923] mb-2">Pronto para comprar?</h2>
            <p className="text-gray-400 text-sm leading-relaxed mb-8 max-w-xs">
              Selecione o mercado, inicie a compra e escaneie os produtos para acompanhar o total em tempo real.
            </p>

            {/* Seleção de mercado */}
            <div className="w-full max-w-xs mb-5">
              <p className="text-xs text-gray-400 uppercase tracking-wider font-medium mb-2 text-left">Onde você está comprando?</p>
              <div className="space-y-2">
                {stores.map(s => (
                  <button key={s} onClick={() => setStore(s)}
                    className={`w-full py-3 px-4 rounded-2xl border-2 text-sm font-medium text-left flex items-center justify-between transition-all active:scale-95 ${
                      store === s
                        ? 'border-[#F59E0B] bg-[#F59E0B]/8 text-[#0F1923]'
                        : 'border-gray-200 bg-white text-gray-400'
                    }`}
                  >
                    {s}
                    {store === s && <Ico n="check" size={16} cls="text-[#F59E0B]"/>}
                  </button>
                ))}
              </div>
            </div>

            <button
              onClick={() => onStartCart(store)}
              className="w-full max-w-xs py-4 rounded-2xl font-black text-white text-base active:scale-95 transition-transform shadow-xl"
              style={{ background: '#0F1923' }}
            >
              Iniciar Compra
            </button>

            <button onClick={onHistory}
              className="mt-5 text-gray-400 text-sm flex items-center gap-1.5 active:text-gray-600 transition-colors">
              <Ico n="history" size={14}/> Ver compras anteriores
            </button>
          </div>
        </div>
      );
    };

    /* ============================================================
       TELA DO CARRINHO
       ============================================================ */
    const CartScreen = ({ cart, uid, onFinalize, onDelete, onHistory }) => {
      const [items,       setItems]       = useState(cart.items || []);
      const [view,    setView]    = useState('cart'); // 'cart'|'scanner'|'lookup'|'addItem'
      const [addData, setAddData] = useState(null);
      const [confirm,   setConfirm]   = useState(null);
      const [saving,    setSaving]    = useState(false);
      const [saveError, setSaveError] = useState(false);
      const prevTotalRef  = useRef(0);
      const [totalKey,    setTotalKey]    = useState(0);

      const total = items.reduce((s, i) => s + i.subtotal, 0);

      useEffect(() => {
        if (prevTotalRef.current !== 0 && total !== prevTotalRef.current)
          setTotalKey(k => k + 1);
        prevTotalRef.current = total;
      }, [total]);

      const persist = async newItems => {
        setSaving(true); setSaveError(false);
        try { await saveCart(uid, cart.id, newItems); }
        catch { setSaveError(true); }
        setSaving(false);
      };

      const handleScan = async ean => {
        // 'lookup' desmonta o scanner ANTES de mostrar o loading
        // evitando conflito de DOM com o Html5Qrcode
        setView('lookup');
        let productName = null, lastPrice = null;
        try {
          if (ean) {
            const cached = await getCachedProduct(uid, ean);
            if (cached) { productName = cached.name || null; lastPrice = cached.lastPrice != null ? cached.lastPrice : null; }
            if (!productName) productName = await lookupEAN(ean);
          }
        } catch(e) {}
        setAddData({ ean: ean || null, productName, lastPrice, editId: null });
        setView('addItem');
      };

      const handleAddItem = async itemData => {
        const newItems = addData?.editId
          ? items.map(i => i.id === addData.editId ? { ...i, ...itemData } : i)
          : [...items, { id: uid4(), addedAt: new Date().toISOString(), ...itemData }];
        if (itemData.ean)
          cacheProduct(uid, itemData.ean, itemData.name, itemData.unitPrice).catch(() => {});
        setItems(newItems);
        setView('cart');
        setAddData(null);
        await persist(newItems);
      };

      const handleDeleteItem = async id => {
        const newItems = items.filter(i => i.id !== id);
        setItems(newItems);
        await persist(newItems);
      };

      const handleEditItem = item => {
        setAddData({ ean: item.ean, productName: item.name, lastPrice: null,
                     editId: item.id, prefillQty: item.qty, prefillPrice: item.unitPrice });
        setView('addItem');
      };

      const promptFinalize = () => setConfirm({
        title: 'Finalizar compra',
        message: `${items.length} ite${items.length===1?'m':'ns'} · Total ${fmt(total)}\n\nCompra salva no histórico.`,
        label: 'Finalizar', color: '#22C55E',
        action: async () => {
          setConfirm(null);
          await finalizeCart(uid, cart.id, items, cart.store);
          onFinalize();
        }
      });

      const promptDelete = () => setConfirm({
        title: 'Excluir compra',
        message: 'Todos os itens serão removidos. Essa ação não pode ser desfeita.',
        label: 'Excluir', color: '#EF4444',
        action: async () => { setConfirm(null); await deleteCart(uid, cart.id); onDelete(); }
      });

      if (view === 'scanner')
        return <ScannerView onScan={handleScan} onCancel={() => setView('cart')}/>;

      if (view === 'lookup')
        return (
          <div className="fixed inset-0 bg-[#0F1923] z-50 flex flex-col items-center justify-center gap-4">
            <Spinner size={48} color="#F59E0B"/>
            <p className="text-white font-medium">Buscando produto...</p>
          </div>
        );

      if (view === 'addItem' && addData)
        return (
          <AddItemForm
            ean={addData.ean} productName={addData.productName}
            lastPrice={addData.lastPrice} editId={addData.editId}
            prefillQty={addData.prefillQty} prefillPrice={addData.prefillPrice}
            onAdd={handleAddItem}
            onBack={() => { setView('cart'); setAddData(null); }}
          />
        );

      return (
        <div className="min-h-screen bg-[#F0F2F5]" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom,0px) + 80px)' }}>
          <Header
            title={cart.store || 'Minha Compra'}
            subtitle={fmtDate(cart.createdAt)}
            right={
              <button onClick={onHistory} className="p-2 -mr-1 text-white/40 active:text-white">
                <Ico n="history" size={20}/>
              </button>
            }
          />

          {/* Faixa do total — divisor estilo recibo */}
          <div className="bg-white border-b-2 border-dashed border-gray-200 px-4 py-4">
            <div className="flex items-end justify-between">
              <div>
                <p className="text-xs text-gray-400 uppercase tracking-wider font-medium">Total da compra</p>
                <p key={totalKey} className="text-4xl font-black text-[#0F1923] tabular leading-none mt-1 total-pop">
                  {fmt(total)}
                </p>
              </div>
              <div className="text-right">
                <p className="text-3xl font-black tabular leading-none text-gray-100">{items.length}</p>
                <p className="text-xs text-gray-400">{items.length === 1 ? 'item' : 'itens'}</p>
                {saving    && <p className="text-[10px] text-[#F59E0B] mt-0.5">Salvando…</p>}
                {saveError && <p className="text-[10px] text-red-400 mt-0.5">Erro ao salvar</p>}
              </div>
            </div>
          </div>

          {/* Lista de itens */}
          <div className="px-4 py-3 space-y-2">
            {items.length === 0 ? (
              <div className="text-center py-16">
                <Ico n="barcode" size={56} cls="text-gray-200 mx-auto mb-3"/>
                <p className="text-gray-400 font-medium">Nenhum item ainda</p>
                <p className="text-gray-300 text-sm mt-1">Toque em <strong>+</strong> para escanear o primeiro produto</p>
              </div>
            ) : items.map(item => (
              <ItemCard key={item.id} item={item} onDelete={handleDeleteItem} onEdit={handleEditItem}/>
            ))}
          </div>

          {/* FAB — Adicionar */}
          <div className="fixed right-4 z-30" style={{ bottom: 'calc(env(safe-area-inset-bottom,0px) + 76px)' }}>
            <button
              onClick={() => setView('scanner')}
              className="w-16 h-16 rounded-full flex items-center justify-center shadow-2xl active:scale-90 transition-transform"
              style={{ background: '#0F1923' }}
            >
              <Ico n="scan" size={26} cls="text-[#F59E0B]"/>
            </button>
          </div>

          {/* Barra inferior */}
          <div className="fixed bottom-0 inset-x-0 bg-white border-t border-gray-100 px-4 pt-3 z-20"
               style={{ paddingBottom: 'calc(env(safe-area-inset-bottom,0px) + 12px)' }}>
            <div className="flex gap-3">
              <button onClick={promptDelete}
                className="flex items-center justify-center gap-1.5 py-3 px-5 rounded-2xl border-2 border-red-100 text-red-400 font-semibold text-sm active:bg-red-50 transition-colors flex-shrink-0">
                <Ico n="trash" size={16}/> Excluir
              </button>
              <button
                onClick={promptFinalize}
                disabled={items.length === 0}
                className="flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl font-bold text-white text-sm disabled:opacity-25 active:opacity-80 shadow-md transition-opacity"
                style={{ background: '#22C55E' }}
              >
                <Ico n="check" size={16}/> Finalizar Compra
              </button>
            </div>
          </div>

          {confirm && (
            <ConfirmDialog
              title={confirm.title} message={confirm.message}
              confirmLabel={confirm.label} confirmColor={confirm.color}
              onConfirm={confirm.action} onCancel={() => setConfirm(null)}
            />
          )}
        </div>
      );
    };

    /* ============================================================
       TELA DE HISTÓRICO
       ============================================================ */
    const HistoryScreen = ({ uid, onBack }) => {
      const [carts,   setCarts]   = useState([]);
      const [loading, setLoading] = useState(true);
      const [detail,  setDetail]  = useState(null);

      useEffect(() => {
        getHistory(uid).then(h => { setCarts(h); setLoading(false); }).catch(() => setLoading(false));
      }, []);

      if (detail) return (
        <div className="min-h-screen bg-[#F0F2F5]">
          <Header title={detail.store || 'Compra'} subtitle={fmtDate(detail.completedAt)} onBack={() => setDetail(null)}/>
          <div className="px-4 py-3 space-y-2">
            {/* Resumo */}
            <div className="bg-[#0F1923] rounded-2xl p-5 text-white flex items-end justify-between">
              <div>
                <p className="text-white/40 text-xs uppercase tracking-wider">Total pago</p>
                <p className="text-4xl font-black tabular">{fmt(detail.total)}</p>
              </div>
              <div className="text-right">
                <p className="text-3xl font-black text-white/20 tabular">{(detail.items||[]).length}</p>
                <p className="text-white/40 text-xs">{(detail.items||[]).length === 1 ? 'item' : 'itens'}</p>
              </div>
            </div>
            {/* Itens */}
            {(detail.items || []).map(item => (
              <div key={item.id} className="bg-white rounded-2xl px-4 py-3 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-gray-800 font-medium text-sm">{item.name}</p>
                  <p className="text-gray-400 text-xs tabular">{item.qty} × {fmt(item.unitPrice)}</p>
                </div>
                <span className="font-black text-gray-700 tabular">{fmt(item.subtotal)}</span>
              </div>
            ))}
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-[#F0F2F5]">
          <Header title="Histórico" onBack={onBack}/>
          {loading
            ? <div className="flex justify-center py-12"><Spinner/></div>
            : carts.length === 0
              ? (
                <div className="text-center py-16 px-6">
                  <Ico n="history" size={52} cls="text-gray-200 mx-auto mb-3"/>
                  <p className="text-gray-400 font-medium">Nenhuma compra finalizada</p>
                  <p className="text-gray-300 text-sm mt-1">As compras finalizadas aparecem aqui</p>
                </div>
              )
              : (
                <div className="px-4 py-3 space-y-2">
                  {carts.map(c => (
                    <button key={c.id} onClick={() => setDetail(c)}
                      className="w-full bg-white rounded-2xl px-4 py-3.5 shadow-sm flex items-center justify-between active:bg-gray-50 text-left">
                      <div>
                        <p className="font-semibold text-gray-800 text-sm">{c.store || 'Compra'}</p>
                        <p className="text-gray-400 text-xs mt-0.5">
                          {fmtDate(c.completedAt)} · {(c.items||[]).length} ite{(c.items||[]).length===1?'m':'ns'}
                        </p>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="font-black text-[#0F1923] tabular">{fmt(c.total)}</span>
                        <span className="text-gray-200 text-lg">›</span>
                      </div>
                    </button>
                  ))}
                </div>
              )
          }
        </div>
      );
    };

    /* ============================================================
       APP RAIZ
       ============================================================ */
    const App = () => {
      const [user,    setUser]    = useState(null);
      const [cart,    setCart]    = useState(null);
      const [loading, setLoading] = useState(true);
      const [screen,  setScreen]  = useState('home'); // 'home'|'cart'|'history'

      useEffect(() => {
        const unsub = auth.onAuthStateChanged(async u => {
          if (!u) { try { await auth.signInAnonymously(); } catch { setLoading(false); } return; }
          setUser(u);
          try {
            const active = await getActiveCart(u.uid);
            if (active) { setCart(active); setScreen('cart'); }
          } catch {}
          setLoading(false);
        });
        return unsub;
      }, []);

      const handleStartCart = async store => {
        setLoading(true);
        try { const c = await createCart(user.uid, store); setCart(c); setScreen('cart'); } catch {}
        setLoading(false);
      };

      if (loading) return <FullLoading/>;

      if (screen === 'history')
        return <HistoryScreen uid={user.uid} onBack={() => setScreen(cart ? 'cart' : 'home')}/>;

      if (screen === 'cart' && cart)
        return (
          <CartScreen
            cart={cart} uid={user.uid}
            onFinalize={() => { setCart(null); setScreen('home'); }}
            onDelete={()   => { setCart(null); setScreen('home'); }}
            onHistory={()  => setScreen('history')}
          />
        );

      return <HomeScreen onStartCart={handleStartCart} onHistory={() => setScreen('history')}/>;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
