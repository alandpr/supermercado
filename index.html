<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Carrinho</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background: #F0F2F5; margin: 0;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .tabular { font-variant-numeric: tabular-nums; }
    @keyframes totalPop {
      0%,100% { transform: scale(1); color: #0F1923; }
      40%      { transform: scale(1.1); color: #22C55E; }
    }
    .total-pop { animation: totalPop 0.38s ease; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .slide-up { animation: slideUp 0.25s ease-out; }
    .fade-in  { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    #qr-reader video { border-radius: 14px; width: 100% !important; }
    #qr-reader img   { border-radius: 14px; }
    #qr-reader { width: 100%; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    var firebaseConfig = {
      apiKey:            "AIzaSyDFyorDB3H0hza1eFOc5VGzNi82uJq_SRI",
      authDomain:        "supermercado-d5b29.firebaseapp.com",
      projectId:         "supermercado-d5b29",
      storageBucket:     "supermercado-d5b29.firebasestorage.app",
      messagingSenderId: "1072113403376",
      appId:             "1:1072113403376:web:0434c01234937fc35a4935"
    };
    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var db   = firebase.firestore();

    // Token Cosmos Bluesoft
    var COSMOS_TOKEN = '0uTlMrDrvNYbYOgvvCHtMQ';
  </script>

  <script type="text/babel">
    var useState  = React.useState;
    var useEffect = React.useEffect;
    var useRef    = React.useRef;

    /* ================================================================
       UTILITÁRIOS
       ================================================================ */
    function fmt(v) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
    }
    function fmtDate(ts) {
      if (!ts) return '';
      var d;
      if (ts && typeof ts.toDate === 'function') { d = ts.toDate(); }
      else if (ts instanceof Date) { d = ts; }
      else { d = new Date(); }
      return new Intl.DateTimeFormat('pt-BR', {
        day: '2-digit', month: '2-digit', year: '2-digit',
        hour: '2-digit', minute: '2-digit'
      }).format(d);
    }
    function uid4() { return Math.random().toString(36).substr(2, 9); }
    function parseNum(s) { return parseFloat(String(s).replace(',', '.')) || 0; }

    /* ================================================================
       FIREBASE
       ================================================================ */
    function cartsRef(uid)    { return db.collection('users/' + uid + '/carts'); }
    function productsRef(uid) { return db.collection('users/' + uid + '/products'); }

    async function getActiveCart(uid) {
      try {
        var snap = await cartsRef(uid).get();
        var docs = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
        return docs.find(function(c) { return c.status === 'active'; }) || null;
      } catch(e) { return null; }
    }
    async function createCart(uid, store) {
      var ref  = cartsRef(uid).doc();
      var data = { status: 'active', store: store || 'BH Supermercados',
                   createdAt: firebase.firestore.FieldValue.serverTimestamp(), items: [], total: 0 };
      await ref.set(data);
      return Object.assign({ id: ref.id }, data, { createdAt: new Date() });
    }
    async function saveCart(uid, cartId, items) {
      var total = items.reduce(function(s, i) { return s + i.subtotal; }, 0);
      await cartsRef(uid).doc(cartId).update({ items: items, total: total });
      return total;
    }
    async function finalizeCart(uid, cartId, items, store) {
      var total = items.reduce(function(s, i) { return s + i.subtotal; }, 0);
      await cartsRef(uid).doc(cartId).update({
        status: 'completed', store: store,
        completedAt: firebase.firestore.FieldValue.serverTimestamp(),
        items: items, total: total
      });
    }
    async function deleteCart(uid, cartId) { await cartsRef(uid).doc(cartId).delete(); }
    async function getHistory(uid) {
      try {
        var snap = await cartsRef(uid).get();
        return snap.docs
          .map(function(d) { return Object.assign({ id: d.id }, d.data()); })
          .filter(function(c) { return c.status === 'completed'; })
          .sort(function(a, b) {
            var da  = (a.completedAt && typeof a.completedAt.toDate === 'function') ? a.completedAt.toDate() : new Date(0);
            var db_ = (b.completedAt && typeof b.completedAt.toDate === 'function') ? b.completedAt.toDate() : new Date(0);
            return db_ - da;
          }).slice(0, 40);
      } catch(e) { return []; }
    }
    async function getCachedProduct(uid, ean) {
      try {
        var doc = await productsRef(uid).doc(ean).get();
        return doc.exists ? doc.data() : null;
      } catch(e) { return null; }
    }
    async function cacheProduct(uid, ean, name, price, thumbnail, avgPrice) {
      if (!ean) return;
      try {
        var data = { name: name, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
        if (price    != null) { data.lastPrice = price; }
        if (thumbnail)        { data.thumbnail = thumbnail; }
        if (avgPrice != null) { data.avgPrice  = avgPrice; }
        await productsRef(uid).doc(ean).set(data, { merge: true });
      } catch(e) {}
    }

    /* ================================================================
       LOOKUP DE PRODUTO
       Tenta: 1) Cosmos direto  2) Cosmos via proxy  3) Open Food Facts
       Retorna: { name, thumbnail, avgPrice } ou null
       ================================================================ */
    // Proxy Google Apps Script — contorna CORS do Cosmos sem expor o token
    var GAS_PROXY = 'https://script.google.com/macros/s/AKfycbypp0DYM-DBqvk2UU7t-z-ahlm4o2RlFvBinfB8U-XnPqLGG1dwcR-7Ps1LJ4QiNZmhw/exec';

    function parseCosmos(data) {
      var name  = data.description || '';
      var brand = (data.brand && data.brand.name) ? data.brand.name : '';
      var full  = '';
      if (name && brand && name.toUpperCase().indexOf(brand.toUpperCase()) === -1) {
        full = name + ' (' + brand + ')';
      } else {
        full = name || brand || '';
      }
      return {
        name:      full || null,
        thumbnail: data.thumbnail || null,
        avgPrice:  (data.avg_price && data.avg_price > 0) ? data.avg_price : null
      };
    }

    async function lookupEAN(ean) {
      // 1) Cosmos via proxy Google Apps Script (sem CORS, sem expor token no browser)
      try {
        var r1 = await fetch(GAS_PROXY + '?ean=' + ean);
        if (r1.ok) {
          var d1 = await r1.json();
          if (d1.description || (d1.brand && d1.brand.name)) {
            return parseCosmos(d1);
          }
        }
      } catch(e) {}

      // 2) Open Food Facts (gratuito, ilimitado, bom para marcas globais)
      try {
        var r2 = await fetch('https://world.openfoodfacts.org/api/v0/product/' + ean + '.json');
        var d2 = await r2.json();
        if (d2.status === 1 && d2.product) {
          var p     = d2.product;
          var name2 = p.product_name_pt || p.product_name || '';
          var brd2  = p.brands || '';
          var thumb2 = p.image_thumb_url || p.image_small_url || null;
          var full2 = '';
          if (name2 && brd2 && name2.toUpperCase().indexOf(brd2.toUpperCase()) === -1) {
            full2 = name2 + ' (' + brd2 + ')';
          } else {
            full2 = name2 || brd2 || '';
          }
          if (full2) return { name: full2, thumbnail: thumb2, avgPrice: null };
        }
      } catch(e) {}

      return null;
    }

    /* ================================================================
       ÍCONES
       ================================================================ */
    function Ico(props) {
      var n = props.n; var size = props.size || 20; var cls = props.cls || '';
      var base = { width: size, height: size, fill: 'none', stroke: 'currentColor',
                   strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
                   viewBox: '0 0 24 24', className: cls, style: { flexShrink: 0, display: 'inline-block' } };
      if (n === 'cart')    return <svg {...base}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>;
      if (n === 'scan')    return <svg {...base}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>;
      if (n === 'trash')   return <svg {...base}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>;
      if (n === 'check')   return <svg {...base} strokeWidth={2.5}><polyline points="20 6 9 17 4 12"/></svg>;
      if (n === 'back')    return <svg {...base}><polyline points="15 18 9 12 15 6"/></svg>;
      if (n === 'history') return <svg {...base}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
      if (n === 'edit')    return <svg {...base}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
      if (n === 'close')   return <svg {...base}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
      if (n === 'barcode') return (
        <svg width={size} height={size} viewBox="0 0 100 56" fill="currentColor" className={cls} style={{ flexShrink:0, display:'inline-block' }}>
          <rect x="2" y="0" width="5" height="56"/><rect x="11" y="0" width="3" height="56"/>
          <rect x="17" y="0" width="7" height="56"/><rect x="27" y="0" width="3" height="56"/>
          <rect x="33" y="0" width="5" height="56"/><rect x="41" y="0" width="3" height="56"/>
          <rect x="47" y="0" width="7" height="56"/><rect x="57" y="0" width="3" height="56"/>
          <rect x="63" y="0" width="5" height="56"/><rect x="71" y="0" width="3" height="56"/>
          <rect x="77" y="0" width="5" height="56"/><rect x="85" y="0" width="3" height="56"/>
          <rect x="91" y="0" width="7" height="56"/>
        </svg>
      );
      return null;
    }

    /* ================================================================
       SPINNER / TELAS DE LOADING
       ================================================================ */
    function Spinner(props) {
      var size = props.size || 32; var color = props.color || '#F59E0B';
      return <div className="animate-spin" style={{ width:size, height:size, borderRadius:'50%',
               border:'4px solid ' + color + '33', borderTopColor:color }}/>;
    }
    function FullLoading(props) {
      return (
        <div className="fixed inset-0 bg-[#F0F2F5] flex flex-col items-center justify-center gap-3 z-50">
          <Spinner size={40}/><p className="text-gray-400 text-sm">{props.text || 'Carregando...'}</p>
        </div>
      );
    }
    function LookupLoading() {
      return (
        <div className="fixed inset-0 z-50 flex flex-col items-center justify-center gap-4" style={{ background:'#0F1923' }}>
          <Spinner size={48} color="#F59E0B"/>
          <p style={{ color:'rgba(255,255,255,0.8)', fontWeight:'500' }}>Buscando produto...</p>
        </div>
      );
    }

    /* ================================================================
       HEADER
       ================================================================ */
    function Header(props) {
      return (
        <div className="bg-[#0F1923] text-white px-4 sticky top-0 z-40 flex items-center justify-between"
             style={{ paddingTop:'calc(env(safe-area-inset-top,0px) + 12px)', paddingBottom:12 }}>
          <div className="flex items-center gap-3">
            {props.onBack
              ? <button onClick={props.onBack} className="p-1 -ml-1 rounded-full active:bg-white/10"><Ico n="back" size={24}/></button>
              : <Ico n="cart" size={22} cls="text-[#F59E0B]"/>}
            <div>
              <p className="font-semibold text-base leading-tight">{props.title}</p>
              {props.subtitle && <p className="text-white/40 text-xs">{props.subtitle}</p>}
            </div>
          </div>
          {props.right}
        </div>
      );
    }

    /* ================================================================
       DIÁLOGO DE CONFIRMAÇÃO
       ================================================================ */
    function ConfirmDialog(props) {
      return (
        <div className="fixed inset-0 bg-black/60 z-[60] flex items-end justify-center fade-in"
             onClick={props.onCancel} style={{ paddingBottom:'env(safe-area-inset-bottom,0px)' }}>
          <div className="bg-white w-full max-w-md rounded-t-3xl px-6 pt-6 pb-8 slide-up"
               onClick={function(e) { e.stopPropagation(); }}>
            {props.title && <h3 className="font-bold text-[#0F1923] text-xl mb-2 text-center">{props.title}</h3>}
            <p className="text-gray-400 text-center mb-6 text-sm leading-relaxed">{props.message}</p>
            <div className="flex gap-3">
              <button onClick={props.onCancel}
                className="flex-1 py-3 rounded-2xl border border-gray-200 text-gray-500 font-medium text-sm active:bg-gray-50">Cancelar</button>
              <button onClick={props.onConfirm}
                className="flex-1 py-3 rounded-2xl text-white font-semibold text-sm active:opacity-80"
                style={{ background: props.confirmColor || '#EF4444' }}>
                {props.confirmLabel || 'Confirmar'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ================================================================
       SCANNER
       ================================================================ */
    function ScannerView(props) {
      var onScan = props.onScan; var onCancel = props.onCancel;
      var ms = useState('camera'); var mode = ms[0]; var setMode = ms[1];
      var mc = useState(''); var manualCode = mc[0]; var setManualCode = mc[1];
      var es = useState(''); var cameraError = es[0]; var setCameraError = es[1];
      var scannerRef = useRef(null); var scannedRef = useRef(false);

      useEffect(function() {
        if (mode !== 'camera') return;
        scannedRef.current = false;
        var scanner;
        try { scanner = new Html5Qrcode('qr-reader'); }
        catch(e) { setCameraError('Câmera indisponível. Use entrada manual.'); setMode('manual'); return; }
        scannerRef.current = scanner;
        scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 280, height: 120 } },
          function(text) {
            if (scannedRef.current) return;
            scannedRef.current = true;
            scannerRef.current = null;
            scanner.stop().then(function() { onScan(text); }, function() { onScan(text); });
          },
          function() {}
        ).catch(function() { setCameraError('Câmera indisponível. Use entrada manual.'); setMode('manual'); });
        return function() {
          if (scannerRef.current) {
            try { scannerRef.current.stop().catch(function() {}); } catch(e) {}
            scannerRef.current = null;
          }
        };
      }, [mode]);

      return (
        <div className="fixed inset-0 z-50 flex flex-col" style={{ background:'#0F1923', paddingTop:'env(safe-area-inset-top,0px)' }}>
          <div className="flex items-center justify-between px-4 py-3">
            <button onClick={onCancel} className="p-1 active:opacity-60"><Ico n="close" size={26} cls="text-white/60"/></button>
            <span className="font-semibold" style={{ color:'white' }}>Adicionar Item</span>
            <button onClick={function() { setCameraError(''); setMode(mode === 'camera' ? 'manual' : 'camera'); }}
              className="text-sm font-semibold px-2 py-1" style={{ color:'#F59E0B' }}>
              {mode === 'camera' ? 'Manual' : 'Câmera'}
            </button>
          </div>
          {mode === 'camera' ? (
            <div className="flex-1 flex flex-col items-center px-4 pt-2">
              <p className="text-sm mb-4" style={{ color:'rgba(255,255,255,0.4)' }}>Aponte para o código de barras</p>
              <div id="qr-reader" className="w-full max-w-sm"/>
              {cameraError && <p className="text-red-400 text-sm mt-3 text-center">{cameraError}</p>}
            </div>
          ) : (
            <div className="flex-1 flex flex-col items-center justify-center px-6">
              <Ico n="barcode" size={56} cls="mb-5" style={{ color:'#F59E0B' }}/>
              <p className="text-sm text-center mb-5" style={{ color:'rgba(255,255,255,0.5)' }}>Digite o código EAN do produto</p>
              <input type="number" inputMode="numeric" value={manualCode}
                onChange={function(e) { setManualCode(e.target.value); }}
                placeholder="7891234567890" autoFocus
                className="w-full rounded-2xl px-4 py-3 text-center text-lg tracking-widest tabular focus:outline-none"
                style={{ background:'rgba(255,255,255,0.1)', color:'white', border:'1px solid rgba(255,255,255,0.2)' }}/>
              <button onClick={function() { if (manualCode.trim()) onScan(manualCode.trim()); }}
                disabled={!manualCode.trim()}
                className="mt-3 w-full py-3 rounded-2xl font-bold active:scale-95"
                style={{ background:'#F59E0B', color:'#0F1923', opacity: manualCode.trim() ? 1 : 0.3 }}>
                Buscar Produto
              </button>
            </div>
          )}
          <div className="px-6" style={{ paddingBottom:'calc(env(safe-area-inset-bottom,0px) + 24px)' }}>
            <button onClick={function() { onScan(''); }}
              className="w-full text-sm py-3 text-center" style={{ color:'rgba(255,255,255,0.3)' }}>
              Adicionar produto sem código de barras
            </button>
          </div>
        </div>
      );
    }

    /* ================================================================
       FORMULÁRIO DE ITEM
       Mostra: foto, nome, marca, preço médio BR, último preço pago
       ================================================================ */
    function AddItemForm(props) {
      var ean         = props.ean;
      var productName = props.productName;
      var lastPrice   = props.lastPrice;
      var avgPrice    = props.avgPrice;
      var thumbnail   = props.thumbnail;
      var editId      = props.editId;
      var prefillQty  = props.prefillQty;
      var prefillPrice = props.prefillPrice;
      var onAdd       = props.onAdd;
      var onBack      = props.onBack;

      var ns = useState(productName || ''); var name = ns[0]; var setName = ns[1];
      var qs = useState(prefillQty != null ? String(prefillQty) : '1'); var qty = qs[0]; var setQty = qs[1];
      var initP = prefillPrice != null ? String(prefillPrice).replace('.', ',')
                  : (lastPrice != null ? String(lastPrice).replace('.', ',') : '');
      var ps = useState(initP); var price = ps[0]; var setPrice = ps[1];
      var en = useState(!productName); var editingName = en[0]; var setEditingName = en[1];

      var qtyN = parseNum(qty); var priceN = parseNum(price);
      var subtotal = qtyN * priceN;
      var canAdd = name.trim() && qtyN > 0 && priceN > 0;

      function adjQty(delta) {
        var next = Math.max(0.5, parseNum(qty) + delta);
        setQty(Number.isInteger(next) ? String(next) : next.toFixed(1));
      }

      return (
        <div className="fixed inset-0 bg-[#F0F2F5] z-50 flex flex-col" style={{ paddingTop:'env(safe-area-inset-top,0px)' }}>
          <div className="bg-[#0F1923] text-white px-4 flex items-center gap-3" style={{ paddingTop:12, paddingBottom:12 }}>
            <button onClick={onBack} className="p-1 -ml-1 active:bg-white/10 rounded-full"><Ico n="back" size={24}/></button>
            <span className="font-semibold text-base">{editId ? 'Editar Item' : 'Adicionar Item'}</span>
          </div>

          <div className="flex-1 overflow-y-auto px-4 py-4 space-y-3">

            {/* Card do produto — com foto */}
            <div className="bg-white rounded-2xl p-4 shadow-sm">
              <div className="flex items-start gap-3">
                {/* Foto do produto */}
                {thumbnail ? (
                  <img src={thumbnail} alt=""
                    style={{ width:72, height:72, objectFit:'contain', borderRadius:12,
                             border:'1px solid #F3F4F6', flexShrink:0, background:'#FAFAFA' }}/>
                ) : (
                  <div style={{ width:72, height:72, borderRadius:12, background:'#F9FAFB',
                                border:'1px solid #F3F4F6', flexShrink:0,
                                display:'flex', alignItems:'center', justifyContent:'center' }}>
                    <Ico n="barcode" size={32} cls="text-gray-200"/>
                  </div>
                )}

                {/* Info do produto */}
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-xs text-gray-400 uppercase tracking-wider font-medium">Produto</span>
                    {productName && (
                      <button onClick={function() { setEditingName(!editingName); }} className="text-xs text-blue-500 font-medium">
                        {editingName ? 'Cancelar' : 'Editar'}
                      </button>
                    )}
                  </div>
                  {ean && <p className="text-xs text-gray-300 tabular">EAN {ean}</p>}
                  {editingName
                    ? <input type="text" value={name} onChange={function(e) { setName(e.target.value); }}
                        placeholder="Nome do produto" autoFocus
                        className="w-full border-b-2 border-[#F59E0B] py-1 text-gray-800 text-sm focus:outline-none bg-transparent mt-1"/>
                    : <p className="text-gray-800 font-semibold text-sm leading-snug mt-0.5"
                         style={{ overflow:'hidden', display:'-webkit-box', WebkitLineClamp:3, WebkitBoxOrient:'vertical' }}>
                        {name || <span className="text-gray-300 italic">Nome não encontrado</span>}
                      </p>
                  }
                </div>
              </div>

              {/* Badges de preço */}
              {(avgPrice != null || lastPrice != null) && (
                <div className="flex flex-wrap gap-2 mt-3 pt-3" style={{ borderTop:'1px solid #F3F4F6' }}>
                  {avgPrice != null && (
                    <span className="text-xs font-medium px-2.5 py-1 rounded-full"
                      style={{ background:'#EFF6FF', color:'#3B82F6' }}>
                      📊 Média BR: {fmt(avgPrice)}
                    </span>
                  )}
                  {lastPrice != null && (
                    <span className="text-xs font-medium px-2.5 py-1 rounded-full"
                      style={{ background:'#F0FDF4', color:'#22C55E' }}>
                      🕐 Última: {fmt(lastPrice)}
                    </span>
                  )}
                </div>
              )}
            </div>

            {/* Quantidade */}
            <div className="bg-white rounded-2xl p-4 shadow-sm">
              <span className="text-xs text-gray-400 uppercase tracking-wider font-medium block mb-3">Quantidade</span>
              <div className="flex items-center gap-4">
                <button onClick={function() { adjQty(-1); }}
                  className="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center text-2xl text-gray-500 active:bg-gray-200 flex-shrink-0">−</button>
                <input type="text" inputMode="decimal" value={qty}
                  onChange={function(e) { setQty(e.target.value); }}
                  className="flex-1 text-center text-3xl font-black text-[#0F1923] focus:outline-none border-b-2 border-gray-100 focus:border-[#F59E0B] pb-1 tabular"/>
                <button onClick={function() { adjQty(1); }}
                  className="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center text-2xl text-gray-500 active:bg-gray-200 flex-shrink-0">+</button>
              </div>
            </div>

            {/* Preço */}
            <div className="bg-white rounded-2xl p-4 shadow-sm">
              <span className="text-xs text-gray-400 uppercase tracking-wider font-medium block mb-3">Preço Unitário</span>
              <div className="flex items-baseline gap-2">
                <span className="text-gray-300 text-xl font-medium">R$</span>
                <input type="text" inputMode="decimal" value={price}
                  onChange={function(e) { setPrice(e.target.value); }}
                  placeholder="0,00"
                  className="flex-1 text-3xl font-black text-[#0F1923] focus:outline-none border-b-2 border-gray-100 focus:border-[#F59E0B] pb-1 tabular"/>
              </div>
              {/* Comparação com média */}
              {avgPrice != null && priceN > 0 && (
                <p className="text-xs mt-2 font-medium"
                   style={{ color: priceN > avgPrice * 1.1 ? '#EF4444' : (priceN < avgPrice * 0.9 ? '#22C55E' : '#6B7280') }}>
                  {priceN > avgPrice * 1.1 ? '⚠️ Acima da média BR' : priceN < avgPrice * 0.9 ? '✅ Abaixo da média BR' : '🟰 Na média BR'}
                </p>
              )}
            </div>

            {/* Subtotal */}
            <div className={'rounded-2xl p-4 ' + (canAdd ? 'bg-yellow-50 border border-yellow-200' : 'bg-gray-50 border border-gray-100')}>
              <div className="flex justify-between items-center">
                <span className="text-gray-400 text-sm">
                  {(qtyN > 0 && priceN > 0) ? (qtyN + ' × ' + fmt(priceN)) : 'Subtotal'}
                </span>
                <span className={'text-2xl font-black tabular ' + (canAdd ? 'text-[#0F1923]' : 'text-gray-200')}>
                  {fmt(subtotal)}
                </span>
              </div>
            </div>
          </div>

          <div className="px-4 pt-3 pb-6 bg-white border-t border-gray-100"
               style={{ paddingBottom:'calc(env(safe-area-inset-bottom,0px) + 16px)' }}>
            <button
              onClick={function() { if (canAdd) onAdd({ ean:ean||null, name:name.trim(), qty:qtyN, unitPrice:priceN, subtotal:subtotal }); }}
              disabled={!canAdd}
              className="w-full py-4 rounded-2xl font-bold text-white text-base active:scale-95 shadow-md"
              style={{ background:canAdd ? '#22C55E' : '#9CA3AF', opacity:canAdd ? 1 : 0.3 }}>
              {editId ? 'Salvar alterações' : 'Adicionar ao Carrinho'}
            </button>
          </div>
        </div>
      );
    }

    /* ================================================================
       CARD DE ITEM
       ================================================================ */
    function ItemCard(props) {
      var item = props.item; var onDelete = props.onDelete; var onEdit = props.onEdit;
      return (
        <div className="bg-white rounded-2xl shadow-sm flex items-center gap-3 px-4 py-3.5 fade-in">
          {item.thumbnail ? (
            <img src={item.thumbnail} alt="" style={{ width:44, height:44, objectFit:'contain',
                   borderRadius:8, border:'1px solid #F3F4F6', flexShrink:0, background:'#FAFAFA' }}/>
          ) : (
            <div style={{ width:44, height:44, borderRadius:8, background:'#F9FAFB',
                          border:'1px solid #F3F4F6', flexShrink:0 }}/>
          )}
          <div className="flex-1 min-w-0">
            <p className="text-gray-800 font-medium text-sm leading-snug"
               style={{ overflow:'hidden', display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical' }}>
              {item.name}
            </p>
            <p className="text-gray-400 text-xs mt-0.5 tabular">
              {item.qty === 1 ? (fmt(item.unitPrice) + '/un') : (item.qty + ' × ' + fmt(item.unitPrice))}
            </p>
          </div>
          <div className="flex items-center gap-1 flex-shrink-0">
            <span className="font-black text-[#0F1923] tabular text-base mr-1">{fmt(item.subtotal)}</span>
            <button onClick={function() { onEdit(item); }} className="p-1.5 rounded-xl text-gray-300 active:bg-blue-50 active:text-blue-500">
              <Ico n="edit" size={16}/>
            </button>
            <button onClick={function() { onDelete(item.id); }} className="p-1.5 rounded-xl text-gray-300 active:bg-red-50 active:text-red-500">
              <Ico n="trash" size={16}/>
            </button>
          </div>
        </div>
      );
    }

    /* ================================================================
       TELA INICIAL
       ================================================================ */
    function HomeScreen(props) {
      var ss = useState('BH Supermercados'); var store = ss[0]; var setStore = ss[1];
      var stores = ['BH Supermercados', 'San Michel', 'Outro'];
      return (
        <div className="min-h-screen bg-[#F0F2F5] flex flex-col">
          <Header title="Carrinho" subtitle="Gestor de compras"
            right={<button onClick={props.onHistory} className="p-2 -mr-1 text-white/50 active:text-white"><Ico n="history" size={22}/></button>}/>
          <div className="flex-1 flex flex-col items-center justify-center px-6 pb-12 text-center">
            <div className="w-24 h-24 rounded-3xl flex items-center justify-center mb-7 shadow-xl" style={{ background:'#0F1923' }}>
              <Ico n="cart" size={44} cls="text-[#F59E0B]"/>
            </div>
            <h2 className="text-2xl font-black text-[#0F1923] mb-2">Pronto para comprar?</h2>
            <p className="text-gray-400 text-sm leading-relaxed mb-8 max-w-xs">
              Escanear o código de barras e o app busca o nome e foto do produto automaticamente.
            </p>
            <div className="w-full max-w-xs mb-5">
              <p className="text-xs text-gray-400 uppercase tracking-wider font-medium mb-2 text-left">Onde você está comprando?</p>
              <div className="space-y-2">
                {stores.map(function(s) {
                  return (
                    <button key={s} onClick={function() { setStore(s); }}
                      className="w-full py-3 px-4 rounded-2xl border-2 text-sm font-medium text-left flex items-center justify-between active:scale-95"
                      style={{ borderColor:store===s?'#F59E0B':'#E5E7EB', background:store===s?'rgba(245,158,11,0.08)':'white', color:store===s?'#0F1923':'#9CA3AF' }}>
                      {s}
                      {store === s && <Ico n="check" size={16} cls="text-[#F59E0B]"/>}
                    </button>
                  );
                })}
              </div>
            </div>
            <button onClick={function() { props.onStartCart(store); }}
              className="w-full max-w-xs py-4 rounded-2xl font-black text-white text-base active:scale-95 shadow-xl"
              style={{ background:'#0F1923' }}>Iniciar Compra</button>
            <button onClick={props.onHistory} className="mt-5 text-gray-400 text-sm flex items-center gap-1.5 active:text-gray-600">
              <Ico n="history" size={14}/> Ver compras anteriores
            </button>
          </div>
        </div>
      );
    }

    /* ================================================================
       TELA DO CARRINHO
       ================================================================ */
    function CartScreen(props) {
      var cart = props.cart; var uid = props.uid;

      var is = useState(cart.items || []); var items = is[0]; var setItems = is[1];
      var vs = useState('cart'); var view = vs[0]; var setView = vs[1];
      var as = useState(null); var addData = as[0]; var setAddData = as[1];
      var cs = useState(null); var confirm = cs[0]; var setConfirm = cs[1];
      var svs = useState(false); var saving = svs[0]; var setSaving = svs[1];
      var ses = useState(false); var saveError = ses[0]; var setSaveError = ses[1];

      var prevTotalRef  = useRef(0);
      var tks = useState(0); var totalKey = tks[0]; var setTotalKey = tks[1];
      var total = items.reduce(function(s, i) { return s + i.subtotal; }, 0);

      useEffect(function() {
        if (prevTotalRef.current !== 0 && total !== prevTotalRef.current)
          setTotalKey(function(k) { return k + 1; });
        prevTotalRef.current = total;
      }, [total]);

      async function persist(newItems) {
        setSaving(true); setSaveError(false);
        try { await saveCart(uid, cart.id, newItems); } catch(e) { setSaveError(true); }
        setSaving(false);
      }

      async function handleScan(ean) {
        setView('lookup');
        var productName = null; var lastPrice = null; var thumbnail = null; var avgPrice = null;
        try {
          if (ean) {
            var cached = await getCachedProduct(uid, ean);
            if (cached) {
              productName = cached.name      || null;
              lastPrice   = cached.lastPrice != null ? cached.lastPrice : null;
              thumbnail   = cached.thumbnail || null;
              avgPrice    = cached.avgPrice  != null ? cached.avgPrice  : null;
            }
            if (!productName) {
              var result = await lookupEAN(ean);
              if (result) {
                productName = result.name;
                thumbnail   = result.thumbnail;
                avgPrice    = result.avgPrice;
              }
            }
          }
        } catch(e) {}
        setAddData({ ean:ean||null, productName:productName, lastPrice:lastPrice,
                     thumbnail:thumbnail, avgPrice:avgPrice, editId:null });
        setView('addItem');
      }

      async function handleAddItem(itemData) {
        var thumb    = addData ? addData.thumbnail : null;
        var avgPr    = addData ? addData.avgPrice  : null;
        var newItem  = Object.assign({ id:uid4(), addedAt:new Date().toISOString(), thumbnail:thumb }, itemData);
        var newItems;
        if (addData && addData.editId) {
          newItems = items.map(function(i) { return i.id === addData.editId ? Object.assign({}, i, itemData) : i; });
        } else {
          newItems = items.concat([newItem]);
        }
        if (itemData.ean) { cacheProduct(uid, itemData.ean, itemData.name, itemData.unitPrice, thumb, avgPr); }
        setItems(newItems);
        setView('cart');
        setAddData(null);
        await persist(newItems);
      }

      async function handleDeleteItem(id) {
        var newItems = items.filter(function(i) { return i.id !== id; });
        setItems(newItems);
        await persist(newItems);
      }

      function handleEditItem(item) {
        setAddData({ ean:item.ean, productName:item.name, lastPrice:null, thumbnail:item.thumbnail,
                     avgPrice:null, editId:item.id, prefillQty:item.qty, prefillPrice:item.unitPrice });
        setView('addItem');
      }

      function promptFinalize() {
        var msg = items.length + (items.length===1?' item':' itens') + ' — Total ' + fmt(total) + '. Salvo no histórico.';
        setConfirm({ title:'Finalizar compra', message:msg, label:'Finalizar', color:'#22C55E',
          action: async function() {
            setConfirm(null); await finalizeCart(uid, cart.id, items, cart.store); props.onFinalize();
          }
        });
      }
      function promptDelete() {
        setConfirm({ title:'Excluir compra', message:'Todos os itens serão removidos permanentemente.',
          label:'Excluir', color:'#EF4444',
          action: async function() { setConfirm(null); await deleteCart(uid, cart.id); props.onDelete(); }
        });
      }

      if (view === 'scanner') return <ScannerView onScan={handleScan} onCancel={function() { setView('cart'); }}/>;
      if (view === 'lookup')  return <LookupLoading/>;
      if (view === 'addItem' && addData) {
        return (
          <AddItemForm ean={addData.ean} productName={addData.productName}
            lastPrice={addData.lastPrice} avgPrice={addData.avgPrice} thumbnail={addData.thumbnail}
            editId={addData.editId} prefillQty={addData.prefillQty} prefillPrice={addData.prefillPrice}
            onAdd={handleAddItem} onBack={function() { setView('cart'); setAddData(null); }}/>
        );
      }

      return (
        <div className="min-h-screen bg-[#F0F2F5]" style={{ paddingBottom:'calc(env(safe-area-inset-bottom,0px) + 80px)' }}>
          <Header title={cart.store || 'Minha Compra'} subtitle={fmtDate(cart.createdAt)}
            right={<button onClick={props.onHistory} className="p-2 -mr-1 text-white/40 active:text-white"><Ico n="history" size={20}/></button>}/>

          {/* Total */}
          <div className="bg-white px-4 py-4" style={{ borderBottom:'2px dashed #E5E7EB' }}>
            <div className="flex items-end justify-between">
              <div>
                <p className="text-xs text-gray-400 uppercase tracking-wider font-medium">Total da compra</p>
                <p key={totalKey} className="text-4xl font-black tabular leading-none mt-1 total-pop" style={{ color:'#0F1923' }}>
                  {fmt(total)}
                </p>
              </div>
              <div className="text-right">
                <p className="text-3xl font-black tabular leading-none text-gray-100">{items.length}</p>
                <p className="text-xs text-gray-400">{items.length===1?'item':'itens'}</p>
                {saving    && <p style={{ fontSize:10, color:'#F59E0B' }}>Salvando…</p>}
                {saveError && <p style={{ fontSize:10, color:'#EF4444' }}>Erro ao salvar</p>}
              </div>
            </div>
          </div>

          {/* Itens */}
          <div className="px-4 py-3 space-y-2">
            {items.length === 0 ? (
              <div className="text-center py-16">
                <Ico n="barcode" size={56} cls="text-gray-200 mx-auto mb-3"/>
                <p className="text-gray-400 font-medium">Nenhum item ainda</p>
                <p className="text-gray-300 text-sm mt-1">Toque em + para escanear o primeiro produto</p>
              </div>
            ) : items.map(function(item) {
              return <ItemCard key={item.id} item={item} onDelete={handleDeleteItem} onEdit={handleEditItem}/>;
            })}
          </div>

          {/* FAB */}
          <div className="fixed right-4 z-30" style={{ bottom:'calc(env(safe-area-inset-bottom,0px) + 76px)' }}>
            <button onClick={function() { setView('scanner'); }}
              className="w-16 h-16 rounded-full flex items-center justify-center shadow-2xl active:scale-90"
              style={{ background:'#0F1923' }}>
              <Ico n="scan" size={26} cls="text-[#F59E0B]"/>
            </button>
          </div>

          {/* Barra inferior */}
          <div className="fixed bottom-0 inset-x-0 bg-white border-t border-gray-100 px-4 pt-3 z-20"
               style={{ paddingBottom:'calc(env(safe-area-inset-bottom,0px) + 12px)' }}>
            <div className="flex gap-3">
              <button onClick={promptDelete}
                className="flex items-center justify-center gap-1.5 py-3 px-5 rounded-2xl border-2 font-semibold text-sm active:opacity-70 flex-shrink-0"
                style={{ borderColor:'#FEE2E2', color:'#F87171' }}>
                <Ico n="trash" size={16}/> Excluir
              </button>
              <button onClick={promptFinalize} disabled={items.length===0}
                className="flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl font-bold text-white text-sm shadow-md"
                style={{ background:'#22C55E', opacity:items.length===0?0.3:1 }}>
                <Ico n="check" size={16}/> Finalizar Compra
              </button>
            </div>
          </div>

          {confirm && <ConfirmDialog title={confirm.title} message={confirm.message}
            confirmLabel={confirm.label} confirmColor={confirm.color}
            onConfirm={confirm.action} onCancel={function() { setConfirm(null); }}/>}
        </div>
      );
    }

    /* ================================================================
       HISTÓRICO
       ================================================================ */
    function HistoryScreen(props) {
      var uid = props.uid; var onBack = props.onBack;
      var crs = useState([]); var carts = crs[0]; var setCarts = crs[1];
      var ls  = useState(true); var loading = ls[0]; var setLoading = ls[1];
      var ds  = useState(null); var detail  = ds[0]; var setDetail  = ds[1];

      useEffect(function() {
        getHistory(uid).then(function(h) { setCarts(h); setLoading(false); }).catch(function() { setLoading(false); });
      }, []);

      if (detail) return (
        <div className="min-h-screen bg-[#F0F2F5]">
          <Header title={detail.store||'Compra'} subtitle={fmtDate(detail.completedAt)} onBack={function() { setDetail(null); }}/>
          <div className="px-4 py-3 space-y-2">
            <div className="rounded-2xl p-5 text-white flex items-end justify-between" style={{ background:'#0F1923' }}>
              <div>
                <p className="text-xs uppercase tracking-wider" style={{ color:'rgba(255,255,255,0.4)' }}>Total pago</p>
                <p className="text-4xl font-black tabular">{fmt(detail.total)}</p>
              </div>
              <div className="text-right">
                <p className="text-3xl font-black tabular" style={{ color:'rgba(255,255,255,0.2)' }}>{(detail.items||[]).length}</p>
                <p className="text-xs" style={{ color:'rgba(255,255,255,0.4)' }}>{(detail.items||[]).length===1?'item':'itens'}</p>
              </div>
            </div>
            {(detail.items||[]).map(function(item) {
              return (
                <div key={item.id} className="bg-white rounded-2xl px-4 py-3 shadow-sm flex items-center gap-3">
                  {item.thumbnail && <img src={item.thumbnail} alt="" style={{ width:40, height:40, objectFit:'contain', borderRadius:8, border:'1px solid #F3F4F6', flexShrink:0 }}/>}
                  <div className="flex-1 min-w-0">
                    <p className="text-gray-800 font-medium text-sm">{item.name}</p>
                    <p className="text-gray-400 text-xs tabular">{item.qty} × {fmt(item.unitPrice)}</p>
                  </div>
                  <span className="font-black text-gray-700 tabular flex-shrink-0">{fmt(item.subtotal)}</span>
                </div>
              );
            })}
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-[#F0F2F5]">
          <Header title="Histórico" onBack={onBack}/>
          {loading
            ? <div className="flex justify-center py-12"><Spinner/></div>
            : carts.length === 0
              ? <div className="text-center py-16 px-6">
                  <Ico n="history" size={52} cls="text-gray-200 mx-auto mb-3"/>
                  <p className="text-gray-400 font-medium">Nenhuma compra finalizada</p>
                </div>
              : <div className="px-4 py-3 space-y-2">
                  {carts.map(function(c) {
                    return (
                      <button key={c.id} onClick={function() { setDetail(c); }}
                        className="w-full bg-white rounded-2xl px-4 py-3.5 shadow-sm flex items-center justify-between active:bg-gray-50 text-left">
                        <div>
                          <p className="font-semibold text-gray-800 text-sm">{c.store||'Compra'}</p>
                          <p className="text-gray-400 text-xs mt-0.5">
                            {fmtDate(c.completedAt)} · {(c.items||[]).length} {(c.items||[]).length===1?'item':'itens'}
                          </p>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="font-black tabular" style={{ color:'#0F1923' }}>{fmt(c.total)}</span>
                          <span className="text-gray-200 text-lg">›</span>
                        </div>
                      </button>
                    );
                  })}
                </div>
          }
        </div>
      );
    }

    /* ================================================================
       APP RAIZ
       ================================================================ */
    function App() {
      var us = useState(null); var user = us[0]; var setUser = us[1];
      var cs = useState(null); var cart = cs[0]; var setCart = cs[1];
      var ls = useState(true); var loading = ls[0]; var setLoading = ls[1];
      var ss = useState('home'); var screen = ss[0]; var setScreen = ss[1];

      useEffect(function() {
        var unsub = auth.onAuthStateChanged(async function(u) {
          if (!u) { try { await auth.signInAnonymously(); } catch(e) { setLoading(false); } return; }
          setUser(u);
          try {
            var active = await getActiveCart(u.uid);
            if (active) { setCart(active); setScreen('cart'); }
          } catch(e) {}
          setLoading(false);
        });
        return unsub;
      }, []);

      async function handleStartCart(store) {
        setLoading(true);
        try { var c = await createCart(user.uid, store); setCart(c); setScreen('cart'); } catch(e) {}
        setLoading(false);
      }

      if (loading) return <FullLoading/>;
      if (screen === 'history') return <HistoryScreen uid={user.uid} onBack={function() { setScreen(cart?'cart':'home'); }}/>;
      if (screen === 'cart' && cart) return (
        <CartScreen cart={cart} uid={user.uid}
          onFinalize={function() { setCart(null); setScreen('home'); }}
          onDelete={function()   { setCart(null); setScreen('home'); }}
          onHistory={function()  { setScreen('history'); }}/>
      );
      return <HomeScreen onStartCart={handleStartCart} onHistory={function() { setScreen('history'); }}/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
